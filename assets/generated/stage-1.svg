<svg xmlns="http://www.w3.org/2000/svg" width="420" height="132" viewBox="0 0 420 132" role="img" aria-labelledby="title">
  <title id="title">STAGE 01: starfall-depths — 星の記憶を探索するターン制ブラウザローグライク</title>
  <style>
    .pulse { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <defs>
    
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="card"><rect width="420" height="132" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">
    <rect width="420" height="132" fill="#0b1022"/>
    <rect width="6" height="132" fill="url(#neon)"/>
    <text x="24" y="30" font-size="12" font-weight="800" letter-spacing="3" fill="#ff2bd6">STAGE 01</text>
    <text x="402" y="30" text-anchor="end" font-size="12" fill="#ffb020">★ 0</text>
    <text x="24" y="62" font-size="20" font-weight="800" fill="#e6e9ff" >starfall-depths</text>
    <text x="24" y="88" font-size="13" fill="#8a90b8">星の記憶を探索するターン制ブラウザローグライク</text>
    <circle cx="29" cy="111" r="5" fill="#3178c6"/><text x="40" y="115" font-size="12" fill="#e6e9ff">TypeScript</text>
    <text x="402" y="115" text-anchor="end" font-size="12" font-weight="700" fill="#00f0ff" class="pulse">ENTER ▶</text>
    <rect width="420" height="132" fill="url(#scan)"/>
  </g>
  <rect x="0.75" y="0.75" width="418.5" height="130.5" rx="11.5" fill="none" stroke="#2a2f55" stroke-width="1.5"/>
</svg>
