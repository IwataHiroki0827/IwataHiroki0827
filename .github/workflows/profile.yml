name: profile-update

# Regenerates the images the README shows, then commits them back.
# Runs daily at 03:00 JST, on manual dispatch, and when the generator changes.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - model/**
      - requirements.txt
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies (three.js, Pillow, numpy)
        run: |
          npm ci
          pip install -r requirements.txt

      # 3D contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Snake eating the contribution grid (neon colours, dark + light)
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#161b22,#3b0764,#7e22ce,#c026d3,#ff2bd6
            assets/generated/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#e9d5ff,#c084fc,#a855f7,#7e22ce

      # Header, headings, status / player data / certifications / loadout cards, model/data/contrib.json
      - run: node scripts/build-svgs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub City GIF from the contribution calendar (skipped when the calendar has not changed)
      - run: python model/render_cpu.py --scene city --data model/data/contrib.json --if-changed

      # Recently played tracks. Does nothing until the three SPOTIFY_* secrets are set.
      - run: node scripts/spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/generated assets/model/github-city.gif assets/model/github-city.json README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update profile images"
            git push
          fi
